name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexmis
          POSTGRES_PASSWORD: nexmis
          POSTGRES_DB: nexmis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexmis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXMIS_TEST_DATABASE_URL: postgres://nexmis:nexmis@localhost:5432/nexmis_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }
      - name: go vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: cross-compile
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/nexmis-server
          done
          for a in amd64 arm64; do
            GOOS=windows GOARCH=$a go build -o /dev/null ./cmd/nexmis-agent
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test (Windows-specific packages)
        run: go test -count=1 ./internal/agent/... ./internal/discovery/... ./internal/protocol/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
